[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "outcomelab"
dynamic = ["version"]
description = "Verify business outcomes against disposable local HTTP services"
requires-python = ">=3.11"

[project.scripts]
outcomelab = "risk_lab.cli:main"
arsenal-risk = "risk_lab.cli:main"

[tool.setuptools]
packages = ["risk_lab"]

[tool.setuptools.dynamic]
version = {attr = "risk_lab.__version__"}
