name: Validate repository

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  skills:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate skills and evaluation manifests
        run: python scripts/validate.py
      - name: Verify risk-lab negative controls
        run: python -m risk_lab --json
      - name: Install and smoke-test OutcomeLab
        run: |
          python -m venv .outcomelab-ci
          python -c "from pathlib import Path; import os, subprocess; p = Path('.outcomelab-ci').resolve(); subprocess.run([p / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python'), '-m', 'pip', 'install', '-e', '.'], check=True)"
          python -c "from pathlib import Path; import os, subprocess; p = Path('.outcomelab-ci').resolve(); exe = p / ('Scripts/outcomelab.exe' if os.name == 'nt' else 'bin/outcomelab'); [subprocess.run([exe, *args], check=True, cwd=p) for args in (['--help'], ['catalog', '--json'], ['doctor', '--project', '..'], ['demo', '--json'], ['validate', '--contract', '../examples/http/v2/webhook-idempotency.json'])]"
      - name: Test evaluation tooling and localhost verification with installed CLI
        run: python -c "from pathlib import Path; import os, subprocess; p = Path('.outcomelab-ci').resolve(); os.environ['OUTCOMELAB_TEST_CLI'] = str(p / ('Scripts/outcomelab.exe' if os.name == 'nt' else 'bin/outcomelab')); subprocess.run([p / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python'), '-m', 'unittest', 'discover', '-s', 'tests', '-v'], check=True)"
      - name: Exercise synthetic example CLI
        run: |
          python scripts/score_evaluation.py examples/paired-evaluation/score-example.json
          python scripts/compare_evaluations.py examples/paired-evaluation/manifest.json
