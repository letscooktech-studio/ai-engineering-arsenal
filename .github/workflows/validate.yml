name: Validate repository

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  skills:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate skills and evaluation manifests
        run: python scripts/validate.py
      - name: Test evaluation tooling
        run: python -m unittest discover -s tests -v
      - name: Exercise synthetic example CLI
        run: |
          python scripts/score_evaluation.py examples/paired-evaluation/score-example.json
          python scripts/compare_evaluations.py examples/paired-evaluation/manifest.json
